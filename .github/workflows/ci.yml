name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run build
      - name: Accessibility (axe-core, every page, light + dark)
        run: |
          bunx playwright-core install --with-deps --only-shell chromium
          bun run preview > preview.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          bun run a11y
        env:
          WRANGLER_SEND_METRICS: false
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .svelte-kit/cloudflare
          retention-days: 3

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cedricpontet.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
